spring.application.name=trade-service
server.port=5002
spring.datasource.url=jdbc:postgresql://localhost:5432/vmlts
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:REDACTED}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:REDACTED}
jwt.expiration=604800000
finnhub.api.key=${FINNHUB_API_KEY:REDACTED}
fcsapi.key=REDACTED
socketio.port=5003
logging.level.com.vmlts=INFO
spring.application.name=api-gateway
server.port=8080

# Route: auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:5001
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route: trade-service (also serves /api/news, folded in)
spring.cloud.gateway.routes[1].id=trade-service
spring.cloud.gateway.routes[1].uri=http://localhost:5002
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/trades/**

spring.cloud.gateway.routes[2].id=news-service
spring.cloud.gateway.routes[2].uri=http://localhost:5002
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/news/**

# Route: lesson-service
spring.cloud.gateway.routes[3].id=lesson-service
spring.cloud.gateway.routes[3].uri=http://localhost:5004
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/learn/**

# Route: payment-service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=http://localhost:5005
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**

# Route: analytics-service
spring.cloud.gateway.routes[5].id=analytics-service
spring.cloud.gateway.routes[5].uri=http://localhost:5006
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/analytics/**

# Route: admin-service
spring.cloud.gateway.routes[6].id=admin-service
spring.cloud.gateway.routes[6].uri=http://localhost:5007
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/admin/**

logging.level.org.springframework.cloud.gateway=INFO
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration